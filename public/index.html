<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HelioDesk | Support CRM</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <div class="shell">
    <aside><a class="brand" href="#"><span>✦</span> HelioDesk</a><p class="workspace">WORKSPACE</p><nav><a class="active" href="#tickets">⌁ Tickets</a><a href="#new-ticket">＋ Create ticket</a></nav><div class="sidebar-note"><strong>Support, made clear.</strong><br>Keep every customer conversation in one calm place.</div></aside>
    <main>
      <header><div><p class="eyebrow">CUSTOMER SUPPORT</p><h1>Tickets</h1><p class="subtle">A shared view of every customer need.</p></div><button class="primary" id="newTicketButton">＋ New ticket</button></header>
      <section class="metrics" id="metrics"></section>
      <section class="toolbar"><label class="search"><span>⌕</span><input id="search" placeholder="Search tickets, customers, or email"></label><select id="statusFilter"><option value="">All statuses</option><option>Open</option><option>In Progress</option><option>Closed</option></select></section>
      <section class="ticket-panel"><div class="panel-heading"><strong>All tickets</strong><span id="resultCount"></span></div><div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Customer</th><th>Subject</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody id="ticketRows"></tbody></table></div><div id="empty" class="empty hidden">No tickets match those filters.</div></section>
    </main>
  </div>
  <div class="modal hidden" id="createModal"><div class="modal-card"><button class="close" data-close="createModal">×</button><p class="eyebrow">NEW REQUEST</p><h2>Create a ticket</h2><form id="createForm"><div class="two"><label>Customer name<input required name="customer_name" placeholder="e.g. Maya Patel"></label><label>Email address<input required type="email" name="customer_email" placeholder="maya@example.com"></label></div><label>Issue title<input required name="subject" placeholder="Briefly describe the issue"></label><label>Description<textarea required name="description" rows="5" placeholder="Share the details your team will need..."></textarea></label><p class="form-error" id="createError"></p><button class="primary wide" type="submit">Create ticket</button></form></div></div>
  <div class="modal hidden" id="detailModal"><div class="modal-card detail"><button class="close" data-close="detailModal">×</button><div id="detailContent"></div></div></div>
  <div class="toast hidden" id="toast"></div><script src="/app.js"></script>
</body></html>
